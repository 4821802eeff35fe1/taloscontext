[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "channelos-backend"
version = "0.3.0"
description = "ChannelOS backend — Telegram Content Operating System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "alembic>=1.13.3",
    "redis>=5.1",
    "arq>=0.26",
    "telethon>=1.36",
    "httpx>=0.27",
    "structlog>=24.4",
    "cryptography>=43.0",
    "argon2-cffi>=23.1",
    "boto3>=1.35",
    "python-multipart>=0.0.12",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12",
    "pypdf>=5.0",
    "orjson>=3.10",
    "itsdangerous>=2.2",
    "pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "aiosqlite>=0.20",
    "factory-boy>=3.3",
    "fakeredis[lua]>=2.26",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI's Depends(...) default-argument pattern is intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059"]  # unpacking fixtures for readability is fine in tests
