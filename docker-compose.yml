services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: channelos
      POSTGRES_PASSWORD: channelos
      POSTGRES_DB: channelos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U channelos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: ./infra/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: channelos
      MINIO_ROOT_PASSWORD: channelos-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file: ${CHANNEL_OS_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

  worker:
    build:
      context: ./backend
    env_file: ${CHANNEL_OS_ENV_FILE:-.env}
    depends_on:
      backend:
        condition: service_healthy
    command: arq app.jobs.worker.WorkerSettings

  scheduler:
    build:
      context: ./backend
    env_file: ${CHANNEL_OS_ENV_FILE:-.env}
    depends_on:
      backend:
        condition: service_healthy
    command: python -m app.jobs.scheduler

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
